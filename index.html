<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TAINAN: A Little Journey｜台南散策 — 一段短短的府城旅行</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div class="game-shell">
    <header class="pixel-topbar">
      <div class="topbar-left">
        <span class="game-badge">TAINAN V1.0</span>
        <span class="hud-scene-label" id="hud-scene-label">SCENE 01｜神農街（午後 14:00）</span>
      </div>
      <div class="topbar-right">
        <!-- Custom Retro Pixel Dropdown (No native select, no emoji) -->
        <div class="custom-dropdown-wrap" id="scene-picker-wrap">
          <button type="button" class="pixel-btn" id="btn-scene-picker">[ 府城景點切換 ▾ ]</button>
          <div class="custom-pixel-menu hidden" id="scene-picker-menu">
            <button type="button" class="custom-pixel-menu-item" data-scene="0">01 神農老街</button>
            <button type="button" class="custom-pixel-menu-item" data-scene="1">02 海安路藝術街</button>
            <button type="button" class="custom-pixel-menu-item" data-scene="2">03 祀典武廟</button>
            <button type="button" class="custom-pixel-menu-item" data-scene="3">04 赤崁樓</button>
            <button type="button" class="custom-pixel-menu-item" data-scene="4">05 永樂市場國華街</button>
            <button type="button" class="custom-pixel-menu-item" data-scene="5">06 臺南孔廟</button>
            <button type="button" class="custom-pixel-menu-item" data-scene="6">07 府中街莿桐花巷</button>
            <button type="button" class="custom-pixel-menu-item" data-scene="7">08 安平古堡</button>
            <button type="button" class="custom-pixel-menu-item" data-scene="8">09 延平老街樹屋</button>
            <button type="button" class="custom-pixel-menu-item" data-scene="9">10 安平水岸夕陽</button>
          </div>
        </div>
        <button type="button" class="pixel-btn primary" id="btn-hud-journal">
          <span id="hud-journal-count">紀念冊 0/12</span>
        </button>
        <button type="button" class="pixel-btn" id="btn-hud-customizer">外觀穿搭</button>
        <button type="button" class="pixel-btn" id="btn-hud-mute">音效：開</button>
        <button type="button" class="pixel-btn" id="btn-hud-pause">設定 [ESC]</button>
      </div>
    </header>

    <main class="viewport-stage">
      <div class="canvas-frame">
        <canvas id="game-canvas" width="400" height="225"></canvas>

        <!-- Crisp World-Space Signboards Layer (#9 店名招牌) -->
        <div id="world-signboards-layer"></div>

        <!-- Vector Crisp Floating Interaction Bubble on DOM Layer -->
        <div id="floating-prompt"></div>

        <!-- High-Resolution DOM Toast Notifications Layer -->
        <div id="toast-container"></div>

        <!-- Mobile & On-Screen Touch Controls (No emoji) -->
        <div class="touch-controls-layer">
          <div class="touch-dpad">
            <button type="button" class="touch-pad-btn" id="touch-left" aria-label="向左移動">◀ 左移</button>
            <button type="button" class="touch-pad-btn" id="touch-right" aria-label="向右移動">右移 ▶</button>
            <button type="button" class="touch-pad-btn" id="touch-run" aria-label="奔跑">疾走</button>
          </div>
          <div class="touch-action">
            <button type="button" class="touch-pad-btn" id="touch-crouch" aria-label="蹲下">蹲伏</button>
            <button type="button" class="touch-pad-btn" id="touch-jump" aria-label="跳躍">跳躍</button>
            <button type="button" class="touch-pad-btn interact-btn" id="touch-interact" aria-label="互動取景">[E] 互動</button>
            <nav class="credit-links" aria-label="作者連結">
              <a
                class="credit-link"
                href="https://github.com/ReiKama414/tainan-little-journey"
                target="_blank"
                rel="noopener noreferrer"
                title="GitHub"
                aria-label="GitHub"
              >
                <svg class="credit-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="currentColor" d="M12 2C6.48 2 2 6.58 2 12.26c0 4.52 2.87 8.35 6.84 9.7.5.1.68-.22.68-.48 0-.24-.01-.87-.01-1.7-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.57 2.34 1.12 2.91.86.09-.66.35-1.12.63-1.38-2.22-.26-4.55-1.14-4.55-5.08 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.32.1-2.75 0 0 .84-.27 2.75 1.05A9.3 9.3 0 0 1 12 6.9c.85 0 1.71.12 2.51.35 1.9-1.32 2.74-1.05 2.74-1.05.55 1.43.2 2.49.1 2.75.64.72 1.03 1.64 1.03 2.76 0 3.95-2.34 4.81-4.57 5.07.36.32.68.94.68 1.9 0 1.38-.01 2.49-.01 2.83 0 .26.18.59.69.48A10.27 10.27 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"/>
                </svg>
              </a>
              <a
                class="credit-link"
                href="https://reikama414.vercel.app/"
                target="_blank"
                rel="noopener noreferrer"
                title="作者的家"
                aria-label="作者的家"
              >
                <svg class="credit-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="currentColor" d="M12 3.2 3 11h2.2v8.5h5.1V14h3.4v5.5h5.1V11H21L12 3.2zm0 2.5 5.8 5.1v7.2h-2.1V13H8.3v5h-2.1v-7.2L12 5.7z"/>
                </svg>
              </a>
            </nav>
          </div>
        </div>

        <!-- Dynamic High-Resolution Modal, Dialogue & Menu Overlays -->
        <div id="modal-layer"></div>
        <div id="menu-layer"></div>
      </div>
    </main>
  </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
